<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แชร์สินค้าให้เพื่อน</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f5f7;
      color: #333;
      text-align: center;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
    }
    .loader {
      border: 4px solid #edf2f7;
      border-top: 4px solid #06C755;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .title { font-weight: 600; font-size: 17px; margin-bottom: 8px; color: #1a202c; }
    .desc { font-size: 13px; color: #718096; line-height: 1.5; margin-bottom: 12px; }
    .btn {
      display: inline-block;
      margin: 6px 4px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .btn-primary { background: #06C755; color: white; }
    .btn-secondary { background: #e2e8f0; color: #4a5568; }
  </style>
</head>
<body>
  <div class="card">
    <div class="loader" id="loader"></div>
    <div class="title" id="statusTitle">กำลังเปิดรายชื่อเพื่อน...</div>
    <div class="desc" id="statusDesc">กรุณารอสักครู่</div>
    <button class="btn btn-primary" id="btnClose" onclick="closeApp()" style="display: none; margin-top: 14px;">ปิดหน้านี้</button>
  </div>

  <script>
    // รหัส LIFF ID ของคุณ
    const LIFF_ID = "2011037822-0aHJEkUs";

    function updateStatus(title, desc, isDone = false) {
      document.getElementById('statusTitle').innerText = title;
      if (desc) document.getElementById('statusDesc').innerText = desc;
      if (isDone) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('btnClose').style.display = 'inline-block';
      }
    }

    function closeApp() {
      try {
        if (liff.isInClient()) {
          liff.closeWindow();
        } else {
          window.close();
        }
      } catch (e) {}
    }

    async function initAndShare() {
      try {
        await liff.init({ liffId: LIFF_ID });

        // ถ้าเปิดบนเบราว์เซอร์ภายนอกแล้วยังไม่ได้ล็อกอิน
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // ดึงข้อมูลสินค้าจาก URL
        const urlParams = new URLSearchParams(window.location.search);
        let name = urlParams.get('name') || 'สินค้าแนะนำ';
        let sku = urlParams.get('sku') || '-';
        let price = urlParams.get('price') || '0';
        let stock = urlParams.get('stock') || 'มีสินค้า';
        let img = urlParams.get('img') || '';
        let oaUrl = urlParams.get('oa') || '';

        // กรณี LINE ซ่อน query ไว้ใน liff.state
        if (urlParams.get('liff.state')) {
          const stateParams = new URLSearchParams(decodeURIComponent(urlParams.get('liff.state')));
          if (stateParams.get('name')) name = stateParams.get('name');
          if (stateParams.get('sku')) sku = stateParams.get('sku');
          if (stateParams.get('price')) price = stateParams.get('price');
          if (stateParams.get('stock')) stock = stateParams.get('stock');
          if (stateParams.get('img')) img = stateParams.get('img');
          if (stateParams.get('oa')) oaUrl = stateParams.get('oa');
        }

        const isOutOfStock = stock.includes('0') || stock.includes('หมด');
        const stockBadgeColor = isOutOfStock ? '#D9534F' : '#28A745';

        // โครงสร้างการ์ด Flex Message (มาตรฐานที่ LINE อนุญาตให้ส่งผ่าน Share Target Picker)
        const flexBubble = {
          type: "bubble",
          size: "kilo",
          body: {
            type: "box",
            layout: "vertical",
            spacing: "sm",
            contents: [
              {
                type: "text",
                text: name,
                weight: "bold",
                size: "md",
                wrap: true
              },
              {
                type: "text",
                text: "รหัส: " + sku,
                size: "xs",
                color: "#888888"
              },
              {
                type: "box",
                layout: "baseline",
                contents: [
                  {
                    type: "text",
                    text: price,
                    weight: "bold",
                    size: "xl",
                    color: "#E03131",
                    flex: 0
                  },
                  {
                    type: "text",
                    text: " บาท",
                    size: "sm",
                    color: "#666666"
                  }
                ]
              },
              {
                type: "text",
                text: stock,
                size: "xs",
                weight: "bold",
                color: stockBadgeColor
              }
            ]
          }
        };

        // ใส่รูปภาพเมื่อเป็น HTTPS ที่ถูกต้องเท่านั้น
        if (img && img.startsWith('https://')) {
          flexBubble.hero = {
            type: "image",
            url: img,
            size: "full",
            aspectRatio: "20:13",
            aspectMode: "cover"
          };
        }

        // ข้อสำคัญ: ใน Share Target Picker จะต้องใช้ปุ่มประเภท "uri" เท่านั้น
        // (LINE ไม่อนุญาตให้ใช้ประเภท "message" หรือ "postback" ในการแชร์ระหว่างผู้ใช้)
        if (oaUrl && oaUrl.startsWith('https://')) {
          flexBubble.footer = {
            type: "box",
            layout: "vertical",
            spacing: "sm",
            contents: [
              {
                type: "button",
                style: "primary",
                color: "#06C755",
                height: "sm",
                action: {
                  type: "uri",
                  label: "💬 สนใจสั่งซื้อ / ติดต่อร้าน",
                  uri: oaUrl
                }
              }
            ]
          };
        }

        if (liff.isApiAvailable('shareTargetPicker')) {
          const res = await liff.shareTargetPicker([
            {
              type: "flex",
              altText: "สินค้า: " + name + " (ราคา " + price + " บาท)",
              contents: flexBubble
            }
          ]);

          if (res) {
            updateStatus("แชร์สำเร็จแล้ว! ✅", "ส่งสินค้าให้เพื่อนเรียบร้อยครับ", true);
            setTimeout(closeApp, 1200);
          } else {
            closeApp();
          }
        } else {
          updateStatus("ไม่สามารถเปิดรายชื่อได้", "กรุณาเปิดสิทธิ์ Share Target Picker ใน LINE Developers", true);
        }

      } catch (err) {
        console.error("LIFF Error:", err);
        updateStatus("เกิดข้อผิดพลาด", err.message || "กรุณาลองใหม่อีกครั้ง", true);
      }
    }

    window.onload = initAndShare;
  </script>
</body>
</html>
